<html>
<head><title>String and math functions</title></head>
<body>
<h2> String functions</h2>
<script>
let str="Hello JavaScript";

document.write("String: "+str+"<br>");

document.write("Length: "+str.length+"<br>");
document.write("Uppercase: "+str.toUpperCase()+"<br>");
document.write("Lowercase: "+str.toLowerCase()+"<br>");
document.write("Character At 0: "+str.charAt(0)+"<br>");
document.write("Substring: "+str.substring(0,5)+"<br>");

document.write("<h2>Math functions</h2>");

document.write("Square root of 25: "+Math.sqrt(25)+"<br>");
document.write("Power (2,3): "+Math.pow(2,3)+"<br>");
document.write("Round 4.6: "+Math.round(4.6)+"<br>");
document.write("Ceil 4.2: "+Math.ceil(4.2)+"<br>");
document.write("Floor 4.8: "+Math.floor(4.8)+"<br>");
document.write("Absolute(-10): "+Math.abs(-10)+"<br>");
</script>

</body>
</html>
