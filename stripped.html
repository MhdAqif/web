<html><head>
<title>Stripped-Table</title>
<style>
#table{
  border-collapse: collapse;
  width:100%;
  font-family: sans-serif;
}
th{
  padding:20px 0px;
  color:white;
  background-color:#b22222;
  border: 1px solid grey;
}
tr:nth-child(even):hover{
  background-color:burlywood;
}
td{
  padding: 8px;
  border: 1px solid grey;
}
</style>
</head>
<body>
<table id="table">
<tr><th>Sl no.</th><th>Name</th><th>Place</th></tr>
<tr><td>1</td><td>Aqif</td><td>Edavanna</td></tr>
<tr><td>2</td><td>Sajeeh</td><td>Kalikavu</td></tr>
<tr><td>3</td><td>Anees</td><td>Malappuram</td></tr>
<tr><td>4</td><td>Sreehari</td><td>Malappuram</td></tr>
<tr><td>5</td><td>Neeraj</td><td>Perinthalmanna</td></tr>
</table>
</body>
</html>
